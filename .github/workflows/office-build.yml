name: Build checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-office.mjs --check
      - run: node scripts/render.mjs --check
      # Only in a private copy: the public repo has no export script.
      - run: if [ -f scripts/export-public.mjs ]; then node scripts/export-public.mjs --check; fi
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/build-office.mjs --dev
      - run: node office/dev/check.mjs routes
